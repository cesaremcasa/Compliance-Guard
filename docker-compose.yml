version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-guard-v3
    volumes:
      - ./models:/app/models
      - cache-data:/tmp/compliance_cache
      - feedback-data:/tmp/feedback
    environment:
      COMPLIANCE_GUARD_BACKEND: ${COMPLIANCE_GUARD_BACKEND:-fake}
    restart: unless-stopped
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped
    networks:
      - monitoring-network
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?set a non-default Grafana administrator username}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set a long Grafana administrator password}
    restart: unless-stopped
    networks:
      - monitoring-network
    depends_on:
      - prometheus

networks:
  monitoring-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  cache-data:
  feedback-data:
