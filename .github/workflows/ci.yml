name: compliance-guard-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: >-
          ruff check src/api/main.py src/api/backends.py tests/test_api.py
          scripts/run_golden_set.py scripts/run_gpu_canary.py
      - name: Unit tests
        run: pytest -q
      - name: Golden set
        run: python scripts/run_golden_set.py --report /tmp/golden_set_fake.json
      - name: Compile check
        run: python -m compileall -q src/api scripts tests

  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit detect-secrets
      - name: Audit CPU dependencies
        run: pip-audit -r requirements.txt
      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt
      - name: Audit optional GPU dependencies
        run: pip-audit -r requirements-gpu.txt
      - name: Audit optional legacy RAG dependencies
        run: pip-audit -r requirements-rag.txt
      - name: Scan repository for secrets
        run: |
          detect-secrets scan --all-files \
            --exclude-files '(^|/)(\.git|models/|\.pytest_cache|\.ruff_cache|.*\.pyc$|.*\.pdf$)' \
            > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path('/tmp/secrets.json').read_text())['results']
          if findings:
              raise SystemExit(f'secrets detected: {findings}')
          print('No secrets detected')
          PY
